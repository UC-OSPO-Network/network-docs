upload_type: presentation

# Files to include in the Zenodo deposit.
# PDF is generated by CI from the slides HTML — if missing, the upload script will warn and skip.
files:
  - iassist-2026-slides.qmd
  - iassist-2026-handout.qmd
  - iassist-2026-slides.html
  - iassist-2026-handout.html
  - iassist-2026-slides.pdf
  - iassist-2026-handout.pdf
  - curioss-members.csv
  - CITATION.cff

# Optional Zenodo-specific fields not in CITATION.cff.
# These are merged into the metadata sent to the Zenodo API.
metadata_overrides:
  conference_session: "Concurrent Session H.1: At the Nexus"
  notes: "Slides and handout produced with Quarto. Source QMD files included for reproducibility."
