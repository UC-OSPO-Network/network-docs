# Places for the history book map and the "On campus today" link boxes.
# Single source for both. Plan: drafts/history-release-plan.md, Phase 2b.
#
# Seeded 2026-11-17 from an external research pass (prompt:
# drafts/2026-11-17-validation-prompt-history-places.md), then checked:
# coordinates against their cited OpenStreetMap ids, all links by HTTP status,
# key facts against their sources. Decisions by Tim Dennis, 2026-11-17.
#
# layer: history = where the work happened; today = UC OSPO Network member
#   campuses; related = non-member campuses with a related unit (listed, not pinned).
# pin: false = listed under the map, no marker.
# place_at_time: false = the pin marks the UC part or a successor, and `prior`
#   names the earlier institution.
# Public places only. Never add a home or a private address.

