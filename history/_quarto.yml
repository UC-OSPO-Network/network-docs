project:
  type: book
  output-dir: _book
  # Checks places.yml and writes _data/places.json for the shortcodes.
  pre-render: python3 ../scripts/build_places.py .

book:
  title: "UC Open Source: A System History"
  subtitle: "How University of California Research Became Global Infrastructure"
  author: "UC OSPO Network"
  date: last-modified
  date-format: "MMMM YYYY"
  favicon: images/uc-ospo-favicon.png
  cover-image: images/uc-ospo-network-logo.svg
  site-url: https://ucospo.net/network-docs/history
  repo-url: https://github.com/UC-OSPO-Network/network-docs
  repo-actions: [issue]
  search: true
  navbar:
    logo: images/uc-ospo-network-logo.svg
    logo-alt: "UC OSPO Network"
    logo-href: https://ucospo.net
    left:
      - text: "Home"
        href: ../index.html
      - text: "Talks"
        href: ../talks.html
      - text: "Outputs"
        href: ../outputs.html
      - text: "History"
        href: index.html
    right:
      - text: "ucospo.net"
        href: https://ucospo.net
      # The GitHub icon comes from repo-url above.
  sidebar:
    style: docked
    background: light
  chapters:
    - index.qmd
    - part: "The Record"
      chapters:
        - 00-internet-itself.qmd
        - 01-foundations.qmd
        - 02-universal-infrastructure.qmd
        - 03-open-science.qmd
        - 04-scientific-computing.qmd
        - 05-infrastructure-at-scale.qmd
    - part: "The Analysis"
      chapters:
        - 06-the-pattern.qmd
        - 07-the-stakes.qmd
        - 08-the-network.qmd
  appendices:
    - appendix-projects.qmd
    - map.qmd

website:
  announcement:
    icon: exclamation-triangle
    dismissable: false
    type: warning
    position: below-navbar
    content: "**Working draft.** This book is not yet complete or fully sourced. Sections marked *Section in preparation* are being researched. Corrections are welcome as [GitHub issues](https://github.com/UC-OSPO-Network/network-docs/issues)."

shortcodes:
  - _filters/places.lua

bibliography: ../references.bib
csl: https://raw.githubusercontent.com/citation-style-language/styles/master/apa.csl

format:
  html:
    theme: [cosmo, ucospo-book.scss]
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-sections: false
    link-external-icon: false
    link-external-newwindow: true
  # pdf: add back when LaTeX available in CI
  #   documentclass: scrreprt
  #   toc: true
