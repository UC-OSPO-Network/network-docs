name: Render and publish slides

on:
  push:
    branches: [main]
    paths:
      - 'presentations/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render IASSIST 2026 slides
        run: quarto render presentations/iassist-2026/iassist-2026-slides.qmd

      - name: Generate PDF
        env:
          PUPPETEER_LAUNCH_OPTIONS: '{"args":["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"]}'
        run: |
          python3 -m http.server 3000 --directory presentations/iassist-2026 &
          SERVER_PID=$!
          sleep 4
          npx --yes decktape reveal \
            http://localhost:3000/iassist-2026-slides.html \
            presentations/iassist-2026/iassist-2026-slides.pdf \
            --size 1280x720 \
            --load-pause 3000
          kill $SERVER_PID 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: presentations/iassist-2026
          destination_dir: presentations/iassist-2026
          keep_files: true
