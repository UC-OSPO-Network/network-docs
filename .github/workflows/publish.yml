name: Render and publish

on:
  push:
    branches: [main]
    paths:
      - 'presentations/**'
      - 'history/**'
      - 'index.qmd'
      - 'ucospo-site.scss'
      - 'references.bib'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site index
        run: quarto render index.qmd

      - name: Render IASSIST 2026 slides
        run: quarto render presentations/iassist-2026/iassist-2026-slides.qmd

      - name: Render IASSIST 2026 handout
        run: quarto render presentations/iassist-2026/iassist-2026-handout.qmd

      - name: Generate PDF
        run: |
          python3 -m http.server 3000 --directory presentations/iassist-2026 &
          SERVER_PID=$!
          sleep 8
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium-browser)
          $CHROME \
            --headless=new \
            --no-sandbox \
            --disable-setuid-sandbox \
            --disable-dev-shm-usage \
            --run-all-compositor-stages-before-draw \
            --print-to-pdf="$(pwd)/presentations/iassist-2026/iassist-2026-slides.pdf" \
            "http://localhost:3000/iassist-2026-slides.html?print-pdf"
          kill $SERVER_PID 2>/dev/null || true

      - name: Render UC OSS History book
        run: quarto render history/

      - name: Deploy site index to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          include_files: index.html
          keep_files: true

      - name: Deploy IASSIST to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: presentations/iassist-2026
          destination_dir: presentations/iassist-2026
          keep_files: true

      - name: Deploy history book to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: history/_book
          destination_dir: history
          keep_files: true
