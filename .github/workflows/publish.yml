name: Render and publish

on:
  push:
    branches: [main]
    paths:
      - 'presentations/**'
      - 'history/**'
      - '_quarto.yml'
      - 'index.qmd'
      - 'talks.qmd'
      - 'outputs.qmd'
      - 'handout.qmd'
      - 'images/**'
      - 'network-outputs.bib'
      - 'references.bib'
      - 'ucospo-site.scss'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Ensure PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml

      - name: Install decktape
        run: npm install -g decktape

      # Generates the Talks and Outputs lists, then quarto render at the root builds
      # the site pages into _site/.
      - name: Build site pages
        run: scripts/build_site.sh

      # Every .qmd in every presentations/*/ folder except drafts. Adding a talk
      # means adding a folder with a talk.yml, with no edits to this workflow.
      - name: Render all presentations
        run: scripts/render_decks.sh

      # Export a PDF for every reveal.js deck (any *slides*.html) via decktape.
      # The server root is presentations/ so that shared paths resolve.
      - name: Generate slide PDFs
        run: |
          set -euo pipefail
          shopt -s nullglob
          python3 -m http.server 3000 --directory presentations >/dev/null 2>&1 &
          server_pid=$!
          sleep 3
          for dir in presentations/*/; do
            grep -qxF "$dir" _draft-talks.txt && continue
            slug=$(basename "$dir")
            for html in "$dir"*slides*.html; do
              base=$(basename "$html" .html)
              echo "decktape -> ${dir}${base}.pdf"
              decktape reveal "http://localhost:3000/${slug}/${base}.html" "${dir}${base}.pdf" \
                --size 1280x720 \
                --chrome-arg=--no-sandbox --chrome-arg=--disable-dev-shm-usage \
                || echo "::warning::decktape failed for ${dir}${base}"
            done
          done
          kill "$server_pid" 2>/dev/null || true

      - name: Render UC OSS History book
        run: quarto render history/

      # Add decks and the book to _site/ from an allow-list. Nothing outside it is published.
      - name: Add decks and book to _site
        run: scripts/stage_site.sh _site

      - name: Check staged site
        run: scripts/check_site.sh _site

      # keep_files: false means files removed from the build disappear from the site.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          keep_files: false
