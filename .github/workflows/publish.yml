name: Render and publish

on:
  push:
    branches: [main]
    paths:
      - 'presentations/**'
      - 'history/**'
      - '_quarto.yml'
      - 'index.qmd'
      - 'outputs.qmd'
      - 'network-outputs.bib'
      - 'scripts/build_outputs.py'
      - 'scripts/build_talks.py'
      - 'talks.qmd'
      - 'scripts/stage_site.sh'
      - 'scripts/build_site.sh'
      - 'ucospo-site.scss'
      - 'references.bib'
      - '.github/workflows/publish.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Ensure PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml

      - name: Install decktape
        run: npm install -g decktape

      # Site pages: generates the Outputs list, then quarto render at the root
      # builds index.html, outputs.html and network-outputs.bib into _site/.
      - name: Build site pages
        run: scripts/build_site.sh

      # Render every .qmd in every presentation folder. Adding a new presentation
      # means dropping a folder under presentations/, with no edits to this workflow.
      - name: Render all presentations
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in presentations/*/; do
            # Draft talks (status: draft in talk.yml) are not rendered or published.
            grep -qxF "$dir" _draft-talks.txt && continue
            qmds=("$dir"*.qmd)
            [ ${#qmds[@]} -eq 0 ] && continue
            echo "::group::Render ${dir}"
            for qmd in "${qmds[@]}"; do
              # Slide decks: render only revealjs for the site (skips pptx and its
              # reference-doc dependency). Handouts and other docs: default format.
              case "$qmd" in
                *slides*) quarto render "$qmd" --to revealjs ;;
                *)        quarto render "$qmd" ;;
              esac
            done
            echo "::endgroup::"
          done

      # Export a PDF for every reveal.js deck (any *slides*.html) via decktape.
      # The server root is presentations/ so that ../_shared/fonts resolves.
      - name: Generate slide PDFs
        run: |
          set -euo pipefail
          shopt -s nullglob
          python3 -m http.server 3000 --directory presentations >/dev/null 2>&1 &
          server_pid=$!
          sleep 3
          for dir in presentations/*/; do
            grep -qxF "$dir" _draft-talks.txt && continue
            slug=$(basename "$dir")
            for html in "$dir"*slides*.html; do
              base=$(basename "$html" .html)
              echo "decktape -> ${dir}${base}.pdf"
              decktape reveal "http://localhost:3000/${slug}/${base}.html" "${dir}${base}.pdf" \
                --size 1280x720 \
                --chrome-arg=--no-sandbox --chrome-arg=--disable-dev-shm-usage \
                || echo "::warning::decktape failed for ${dir}${base}"
            done
          done
          kill "$server_pid" 2>/dev/null || true

      - name: Render UC OSS History book
        run: quarto render history/

      # Build _site/ from an allow-list. Nothing outside it is published.
      - name: Add decks and book to _site
        run: scripts/stage_site.sh _site

      - name: Check staged site
        run: |
          set -euo pipefail
          bad=$(find _site -type f \( -name '*.md' -o -name '*.qmd' -o -name '*.scss' -o -name '*.py' -o -name '*.sh' -o -name 'Makefile' -o -name '*.yml' -o -name '*.csv' -o -name '*.pptx' -o -name '.gitignore' \) ! -path '_site/history/*' ! -path '*_files/*')
          if [ -n "$bad" ]; then echo "::error::Working files in _site:"; echo "$bad"; exit 1; fi
          for f in index.html outputs.html network-outputs.bib history/index.html; do
            test -s "_site/$f" || { echo "::error::Missing _site/$f"; exit 1; }
          done

      # keep_files: false means files removed from the build disappear from the site.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          keep_files: false
