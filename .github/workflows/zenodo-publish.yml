name: Publish to Zenodo

# Tag conventions:
#   publish/iassist-2026/v1.0      → production Zenodo (creates draft; human reviews and publishes)
#   publish-test/iassist-2026/v1.0 → sandbox Zenodo (creates and auto-publishes for testing)
#
# Required secrets:
#   ZENODO_TOKEN         — production API token (zenodo.org)
#   ZENODO_SANDBOX_TOKEN — sandbox API token (sandbox.zenodo.org)

on:
  push:
    tags:
      - 'publish/*/v*'
      - 'publish-test/*/v*'

jobs:
  zenodo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Parse tag
        id: tag
        run: |
          REF="${{ github.ref_name }}"
          SLUG=$(echo "$REF" | cut -d'/' -f2)
          VERSION=$(echo "$REF" | cut -d'/' -f3)
          if [[ "$REF" == publish-test/* ]]; then
            SANDBOX=true
          else
            SANDBOX=false
          fi
          echo "slug=$SLUG"       >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sandbox=$SANDBOX" >> $GITHUB_OUTPUT
          echo "pres_path=presentations/$SLUG" >> $GITHUB_OUTPUT

      - name: Render slides and handout
        run: |
          SLUG="${{ steps.tag.outputs.slug }}"
          PRES="${{ steps.tag.outputs.pres_path }}"
          [ -f "$PRES/${SLUG}-slides.qmd"  ] && quarto render "$PRES/${SLUG}-slides.qmd"
          [ -f "$PRES/${SLUG}-handout.qmd" ] && quarto render "$PRES/${SLUG}-handout.qmd"

      - name: Generate PDFs
        run: |
          SLUG="${{ steps.tag.outputs.slug }}"
          PRES="${{ steps.tag.outputs.pres_path }}"
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium-browser)

          python3 -m http.server 3000 --directory "$PRES" &
          SERVER_PID=$!
          sleep 8

          # Slides PDF — Reveal.js print mode
          $CHROME \
            --headless=new \
            --no-sandbox \
            --disable-setuid-sandbox \
            --disable-dev-shm-usage \
            --run-all-compositor-stages-before-draw \
            --print-to-pdf="$(pwd)/$PRES/${SLUG}-slides.pdf" \
            "http://localhost:3000/${SLUG}-slides.html?print-pdf"

          # Handout PDF — plain print (already print-styled with @page)
          $CHROME \
            --headless=new \
            --no-sandbox \
            --disable-setuid-sandbox \
            --disable-dev-shm-usage \
            --print-to-pdf="$(pwd)/$PRES/${SLUG}-handout.pdf" \
            "http://localhost:3000/${SLUG}-handout.html"

          kill $SERVER_PID 2>/dev/null || true

      - name: Install Python dependencies
        run: pip install requests pyyaml

      - name: Upload to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_SANDBOX_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
          ZENODO_SANDBOX: ${{ steps.tag.outputs.sandbox }}
          PRES_PATH: ${{ steps.tag.outputs.pres_path }}
          PRES_SLUG: ${{ steps.tag.outputs.slug }}
        run: python .github/scripts/zenodo_upload.py
